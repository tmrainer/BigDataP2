## Stack del Proyecto Grupal II - Big Data (UTEC)
## VM recomendada: e2-standard-4 (4 vCPU, 16 GB RAM), Ubuntu 22.04, 50 GB disco.
##
## Corre en la VM:   Cassandra, Postgres (metadata Airflow), Airflow, JupyterLab, Streamlit
## Corre fuera (SaaS gratis): MongoDB Atlas Free, Neo4j AuraDB Free  -> credenciales en .env
##
## Uso:
##   cp .env.example .env   (y completar MONGO_URI, NEO4J_URI, NEO4J_PASSWORD)
##   docker compose up -d
##   docker compose logs -f airflow-init   (esperar "Airflow inicializado")

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/Dockerfile.airflow
  env_file: .env
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: "30"
    PYTHONPATH: /opt/airflow/src
    CASSANDRA_HOST: cassandra
  volumes:
    - ./dags:/opt/airflow/dags
    - ./src:/opt/airflow/src
    - ./data:/opt/airflow/data
    - airflow-logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy
    cassandra:
      condition: service_healthy

services:

  # ---------------------------------------------------------------- Cassandra
  cassandra:
    image: cassandra:4.1
    container_name: cassandra
    hostname: cassandra
    ports:
      - "127.0.0.1:9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: bigdata_cluster
      CASSANDRA_DC: dc1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      # Limitar memoria para convivir con Airflow y Jupyter en 16 GB
      MAX_HEAP_SIZE: 2G
      HEAP_NEWSIZE: 400M
    volumes:
      - cassandra-data:/var/lib/cassandra
      - ./scripts:/scripts:ro
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces' || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 60s
    restart: unless-stopped

  # ------------------------------------------------- Postgres (metadata Airflow)
  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
    restart: unless-stopped

  # ------------------------------------------------------------------ Airflow
  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username "${AIRFLOW_ADMIN_USER:-admin}" \
          --password "${AIRFLOW_ADMIN_PASSWORD:-admin}" \
          --firstname Admin --lastname UTEC --role Admin \
          --email admin@example.com || true
        echo "Airflow inicializado"
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    command: webserver
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # ------------------------------------------------------------------ Jupyter
  jupyter:
    build:
      context: .
      dockerfile: docker/Dockerfile.jupyter
    container_name: jupyter
    env_file: .env
    environment:
      CASSANDRA_HOST: cassandra
      PYTHONPATH: /home/jovyan/work/src
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:-bigdata}
    ports:
      - "127.0.0.1:8888:8888"
    volumes:
      - ./:/home/jovyan/work
    depends_on:
      cassandra:
        condition: service_healthy
    restart: unless-stopped

  # ---------------------------------------------------------------- Dashboard
  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
    container_name: dashboard
    env_file: .env
    environment:
      CASSANDRA_HOST: cassandra
      PYTHONPATH: /app/src
    ports:
      - "8501:8501"          # público si abres la regla de firewall (ver README)
    volumes:
      - ./dashboard:/app/dashboard
      - ./src:/app/src
    depends_on:
      cassandra:
        condition: service_healthy
    restart: unless-stopped

volumes:
  cassandra-data:
  postgres-data:
  airflow-logs:
